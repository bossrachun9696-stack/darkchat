<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fe8"/>
      <stop offset="1" stop-color="#1c56b8"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e9f6ff"/>
      <stop offset="0.55" stop-color="#9fd4ff"/>
      <stop offset="1" stop-color="#4ea7f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b2f6e" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- หยดน้ำ -->
  <path filter="url(#sh)" fill="url(#drop)"
        d="M256 78 C 256 78 146 214 146 302 C 146 365 195 414 256 414 C 317 414 366 365 366 302 C 366 214 256 78 256 78 Z"/>
  <!-- แสงสะท้อน -->
  <path fill="#ffffff" opacity="0.75" d="M206 292 C 206 256 226 220 246 192 C 234 228 228 262 232 300 C 234 322 214 326 208 312 C 207 306 206 299 206 292 Z"/>
  <circle cx="300" cy="352" r="12" fill="#ffffff" opacity="0.35"/>
</svg>
